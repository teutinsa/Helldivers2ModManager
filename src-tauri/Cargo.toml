[package]
name = "hd2mm"
version = "0.1.0"
description = "A simple mod manager for Helldivers 2."
authors = ["you"]
edition = "2021"

[lib]
name = "hd2mm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

