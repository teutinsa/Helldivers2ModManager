[package]
name = "hd2mm"
version = "2.0.0-preview"
description = "A simple mod manager for Helldivers 2."
authors = ["you"]
edition = "2021"

[lib]
name = "hd2mm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
uuid = { version = "1.23", features = ["serde", "v4"] }
tokio = { version = "1.52", features = ["fs"] }
anyhow = "1.0"
anyhow-tauri = "1.0"
zip = "8.5"
sevenz-rust2 = { version = "0.20", features = ["util"] }
unrar = "0.5"
tauri-plugin-dialog = "2.7.0"
futures = "0.3"
