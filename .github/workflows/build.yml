name: Build

on:
  push:
    branches: [ 2.0-rewrite ]
    tags: [ 'v*_preview*' ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: Install frontend dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm tauri build
      
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: Release Preview
          draft: true
          prerelease: true
          files: src-tauri/target/release/hd2mm.exe

  
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: Install frontend dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm tauri build
      
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: Release Preview
          draft: true
          prerelease: true
          files: src-tauri/target/release/hd2mm